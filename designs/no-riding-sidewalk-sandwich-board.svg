<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="No Riding on the Sidewalk sandwich board sign">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6F8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Board panel -->
  <rect x="20" y="20" width="560" height="860" rx="28" fill="url(#board)" stroke="#111827" stroke-width="10"/>
  <!-- Top color band -->
  <rect x="20" y="20" width="560" height="150" rx="28" fill="#D62828"/>
  <rect x="20" y="120" width="560" height="50" fill="#D62828"/>

  <!-- Headline in band -->
  <text x="300" y="88" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" letter-spacing="1">NO RIDING</text>
  <text x="300" y="146" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" letter-spacing="6">ON THE SIDEWALK</text>

  <!-- Prohibition icon -->
  <g transform="translate(300,410)" filter="url(#soft)">
    <circle r="170" fill="#FFFFFF" stroke="#D62828" stroke-width="30"/>
    <!-- Bicycle silhouette -->
    <g transform="translate(-118,-52)" fill="none" stroke="#111827" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="55" cy="118" r="52"/>
      <circle cx="181" cy="118" r="52"/>
      <path d="M55 118 L110 118 L150 55 L96 55"/>
      <path d="M110 118 L150 55"/>
      <path d="M181 118 L150 55"/>
      <path d="M96 55 L78 40"/>
      <path d="M181 118 L206 50 L226 50"/>
      <path d="M40 118 L70 118"/>
    </g>
    <!-- Slash -->
    <line x1="-120" y1="120" x2="120" y2="-120" stroke="#D62828" stroke-width="30" stroke-linecap="round"/>
  </g>

  <!-- Subtext -->
  <text x="300" y="648" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="34" fill="#111827">Bikes • Scooters • Skateboards</text>
  <text x="300" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="30" fill="#374151">Please walk them on the sidewalk</text>

  <!-- CTA pill -->
  <rect x="150" y="740" width="300" height="72" rx="36" fill="#111827"/>
  <text x="300" y="787" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#FFFFFF" letter-spacing="2">THANK YOU</text>

  <!-- Footer note -->
  <text x="300" y="852" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="18" fill="#6B7280">For everyone's safety • Keep our sidewalks pedestrian-friendly</text>
</svg>
