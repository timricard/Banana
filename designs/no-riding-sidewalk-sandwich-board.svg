<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040" role="img" aria-label="No Riding on the Sidewalk A-frame sandwich board, shown on a sidewalk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF1F6"/>
      <stop offset="1" stop-color="#D8E2EA"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2F5"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E23A3A"/>
      <stop offset="1" stop-color="#C21F1F"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3440"/>
      <stop offset="1" stop-color="#161C24"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B1220" flood-opacity="0.28"/>
    </filter>
    <radialGradient id="groundShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0B1220" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Scene -->
  <rect x="0" y="0" width="900" height="1040" fill="url(#sky)"/>
  <!-- Sidewalk -->
  <rect x="0" y="820" width="900" height="220" fill="#C4CDD5"/>
  <line x1="300" y1="820" x2="300" y2="1040" stroke="#AAB4BD" stroke-width="4"/>
  <line x1="600" y1="820" x2="600" y2="1040" stroke="#AAB4BD" stroke-width="4"/>
  <line x1="0" y1="880" x2="900" y2="880" stroke="#AAB4BD" stroke-width="3"/>
  <!-- Contact shadow -->
  <ellipse cx="450" cy="905" rx="330" ry="42" fill="url(#groundShadow)"/>

  <!-- A-frame back leg -->
  <g transform="translate(0,0)">
    <polygon points="628,150 690,880 748,880 690,150" fill="#0F141B"/>
  </g>

  <!-- Board panel (front face) -->
  <g filter="url(#drop)">
    <polygon points="270,150 630,150 690,880 210,880" fill="url(#frame)"/>
    <!-- Face -->
    <polygon points="292,172 608,172 664,858 236,858" fill="url(#board)"/>
  </g>

  <!-- Content is drawn on a straightened panel via group, then subtly skewed feel kept simple/legible -->
  <g>
    <!-- Top red band -->
    <path d="M292 172 H608 L618 316 H282 Z" fill="url(#band)"/>
    <text x="450" y="232" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="#FFFFFF" letter-spacing="1">NO RIDING</text>
    <text x="450" y="292" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="7">ON THE SIDEWALK</text>

    <!-- Prohibition icon row: bike, scooter, skateboard -->
    <!-- Big central bike in prohibition ring -->
    <g transform="translate(450,470)" filter="url(#drop)">
      <circle r="128" fill="#FFFFFF" stroke="#C21F1F" stroke-width="24"/>
      <g transform="translate(-88,-40)" fill="none" stroke="#161C24" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="42" cy="90" r="40"/>
        <circle cx="138" cy="90" r="40"/>
        <path d="M42 90 L84 90 L114 42 L74 42"/>
        <path d="M84 90 L114 42"/>
        <path d="M138 90 L114 42"/>
        <path d="M138 90 L158 38 L172 38"/>
        <path d="M30 90 L54 90"/>
      </g>
      <line x1="-90" y1="90" x2="90" y2="-90" stroke="#C21F1F" stroke-width="24" stroke-linecap="round"/>
    </g>

    <!-- Small scooter icon -->
    <g transform="translate(330,632)">
      <circle r="52" fill="#FFFFFF" stroke="#C21F1F" stroke-width="11"/>
      <g transform="translate(-30,-26)" fill="none" stroke="#161C24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="46" r="10"/>
        <circle cx="54" cy="46" r="10"/>
        <path d="M8 46 L48 46"/>
        <path d="M48 46 L52 8 L64 8"/>
      </g>
      <line x1="-36" y1="36" x2="36" y2="-36" stroke="#C21F1F" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- Small skateboard icon -->
    <g transform="translate(570,632)">
      <circle r="52" fill="#FFFFFF" stroke="#C21F1F" stroke-width="11"/>
      <g transform="translate(-32,-14)" fill="none" stroke="#161C24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20 Q34 34 64 20"/>
        <circle cx="18" cy="34" r="7"/>
        <circle cx="50" cy="34" r="7"/>
      </g>
      <line x1="-36" y1="36" x2="36" y2="-36" stroke="#C21F1F" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- Sub messaging -->
    <text x="450" y="742" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#161C24">Please walk your wheels here</text>
    <text x="450" y="778" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="22" fill="#4A5560">Bikes · Scooters · Skateboards · E-bikes</text>

    <!-- Thank you pill -->
    <rect x="352" y="800" width="196" height="44" rx="22" fill="#161C24"/>
    <text x="450" y="829" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="2">THANK YOU</text>
  </g>
</svg>
